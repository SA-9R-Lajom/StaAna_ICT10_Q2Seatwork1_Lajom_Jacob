<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Car Enthusiast Club | Candidate Verification</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://pyscript.net/releases/2024.1.1/core.css"
    />

    <script
      type="module"
      src="https://pyscript.net/releases/2024.1.1/core.js"
    ></script>

    <style>
      body {
        background: linear-gradient(135deg, #101010, #292929);
        color: white;
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .verification-card {
        background-color: #1b1b1b;
        border: 1px solid #383838;
        border-radius: 18px;
        padding: 35px;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
      }

      .car-icon {
        font-size: 55px;
        margin-bottom: 10px;
      }

      h1 {
        color: #ff3030;
        font-weight: bold;
        font-size: 27px;
      }

      .subtitle {
        color: #bdbdbd;
        margin-bottom: 30px;
      }

      .form-label {
        color: #eeeeee;
        font-weight: bold;
      }

      .form-control {
        background-color: #292929;
        border: 1px solid #484848;
        color: white;
        padding: 12px;
        border-radius: 8px;
      }

      .form-control:focus {
        background-color: #292929;
        color: white;
        border-color: #ff3030;
        box-shadow: 0 0 0 0.2rem rgba(255, 48, 48, 0.2);
      }

      .form-control::placeholder {
        color: #999999;
      }

      .verify-button {
        background-color: #ff3030;
        color: white;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        padding: 13px;
        width: 100%;
        margin-top: 15px;
        transition: 0.3s;
      }

      .verify-button:hover {
        background-color: #d92020;
        transform: translateY(-2px);
      }

      #result {
        margin-top: 25px;
        padding: 15px;
        border-radius: 8px;
        text-align: center;
        font-weight: bold;
        overflow-wrap: anywhere;
      }

      .footer-text {
        color: #777777;
        font-size: 12px;
        margin-top: 25px;
      }
    </style>
  </head>

  <body>
    <div class="verification-card">
      <div class="text-center">
        <div class="car-icon">🏎️</div>

        <h1>CAR ENTHUSIAST CLUB</h1>

        <p class="subtitle">Candidate Verification System</p>
      </div>

      <form id="verification-form">
        <div class="mb-3">
          <label for="first-name" class="form-label"> First Name </label>

          <input
            type="text"
            id="first-name"
            class="form-control"
            placeholder="Enter your first name"
            required
          />
        </div>

        <div class="mb-3">
          <label for="last-name" class="form-label"> Last Name </label>

          <input
            type="text"
            id="last-name"
            class="form-control"
            placeholder="Enter your last name"
            required
          />
        </div>

        <button type="submit" class="verify-button" py-click="verify_candidate">
          VERIFY MEMBERSHIP
        </button>
      </form>

      <div id="result" class="d-none" aria-live="polite"></div>

      <div class="text-center footer-text">JOIN THE COMMUNITY.</div>
    </div>

    <script type="py" src="./main.py"></script>
  </body>
</html>
